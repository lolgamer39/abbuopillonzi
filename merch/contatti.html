<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contatti — ABP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #03151f;
      --bg-card: #061c28;
      --purple: #a373bd;
      --purple-dark: #5b1a6b;
      --accent: #33d17a;
      --text-main: #f4f7fb;
      --text-muted: #a7b8c3;
      --insta-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .contact-card {
      background: var(--bg-card);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h2 { color: var(--purple); margin-bottom: 0.5rem; margin-top: 0; }
    p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }

    .product-highlight {
      background: rgba(163, 115, 189, 0.1);
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid var(--purple);
      margin-bottom: 1.5rem;
      text-align: left;
    }

    label { display: block; text-align: left; font-size: 0.8rem; margin-bottom: 5px; color: var(--purple); }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 1.2rem;
      border-radius: 8px;
      border: 1px solid #1a3a4a;
      background: #03151f;
      color: white;
      box-sizing: border-box;
      font-family: inherit;
    }

    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: var(--purple-dark);
      color: white;
      border: none;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      font-size: 1rem;
    }

    .btn-submit:hover {
      background: var(--purple);
      transform: translateY(-2px);
    }

    /* --- STILE SEZIONE INSTAGRAM --- */
    .divider {
      margin: 1.5rem 0;
      display: flex;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #1a3a4a;
      margin: 0 10px;
    }

    .btn-insta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.9rem;
      background: var(--insta-gradient);
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      transition: 0.3s;
      box-sizing: border-box;
    }

    .btn-insta:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    .back-link {
      display: block;
      margin-top: 1.5rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="contact-card">
  <h2>Richiedi info</h2>
  <p>Compila il modulo o scrivimi sui social.</p>

  <form action="https://formspree.io/f/mvzrwjzp" method="POST">
    
    <div class="product-highlight">
      <label>Prodotto selezionato:</label>
      <strong id="product-display">Caricamento...</strong>
      <input type="hidden" name="prodotto" id="product-hidden">
    </div>

    <input type="text" name="nome" placeholder="Il tuo nome" required>
    <input type="email" name="email" placeholder="La tua email" required>
    <textarea name="messaggio" rows="3" placeholder="Scrivi qui la tua domanda..."></textarea>

    <button type="submit" class="btn-submit">Invia via Email</button>
  </form>

  <div class="divider">oppure</div>

  <a href="https://www.instagram.com/abp___official/" target="_blank" class="btn-insta">
    Contattami su Instagram
  </a>

  <a href="javascript:history.back()" class="back-link">← Torna al merch</a>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const nomeProdotto = params.get('prodotto');
  if (nomeProdotto) {
    document.getElementById('product-display').textContent = nomeProdotto;
    document.getElementById('product-hidden').value = nomeProdotto;
  }
</script>

</body>
</html>
